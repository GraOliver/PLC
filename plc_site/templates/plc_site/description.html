<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ajouter une activité</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
    }
    .sidebar {
      background-color: #054d27;
      color: white;
      width: 250px;
      padding: 20px;
    }
    .sidebar img {
      max-width: 100%;
      height: auto;
      margin-bottom: 30px;
    }
    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      margin: 10px 0;
      padding: 8px;
      border-radius: 5px;
    }
    .sidebar a:hover {
      background-color: #0a6b3f;
    }
    .content {
      flex: 1;
      padding: 30px;
      background-color: #f8f9fa;
    }
    .preview-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <img src="logo.png" alt="Logo de la marque">
    <a href="#">Carousel</a>
    <a href="#">Produits</a>
    <a href="#">Personnel</a>
    <a href="#">Blog</a>
    <a href="#">Collaborateurs</a>
    <a href="#">Nos services</a>
  </div>

  <!-- Contenu principal -->
  <div class="content">
    <h1 class="mb-4">Ajouter une activité</h1>

    <!-- Onglet actif -->
    <h3 class="mb-3">Blog</h3>

    <!-- Formulaire -->
    <form method="POST" enctype="multipart/form-data">
      <div class="row g-4">

        <!-- Partie gauche : champs -->
        <div class="col-md-6">
          <div class="mb-3">
            <label for="titre" class="form-label">Titre</label>
            <input type="text" class="form-control" id="titre" name="titre" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
          </div>
          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>
          <div class="mb-3">
            <label for="image" class="form-label">Image</label>
            <input class="form-control" type="file" id="image" name="image" accept="image/*" onchange="previewImage(event)">
          </div>
          <button type="submit" class="btn btn-success">Enregistrer</button>
        </div>

        <!-- Partie droite : prévisualisation -->
        <div class="col-md-6">
          <div class="text-center">
            <img id="imgPreview" class="preview-img d-none" alt="Prévisualisation de l’image">
            <h5 id="imgTitle" class="mt-3 text-muted d-none">Titre affiché ici</h5>
          </div>
        </div>

      </div>
    </form>
  </div>

  <script>
    function previewImage(event) {
      const input = event.target;
      const file = input.files[0];
      const preview = document.getElementById('imgPreview');
      const title = document.getElementById('imgTitle');
      const titre = document.getElementById('titre');

      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.classList.remove('d-none');
          title.textContent = titre.value || 'Aperçu de l’image';
          title.classList.remove('d-none');
        };
        reader.readAsDataURL(file);
      }
    }
  </script>

</body>
</html>
