<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Activités</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .sidebar {
            background-color: #14532d;
            min-height: 100vh;
            color: white;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #166534;
        }
        .preview-image {
            width: 100%;
            height: 250px;
            border-radius: 4px;
            object-fit: cover;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-3">
            <div class="mb-4 text-center">
                <img src="/static/logo.png" alt="Logo" class="img-fluid">
            </div>
            <a href="#">Carousel</a>
            <a href="#">Produit</a>
            <a href="#">Personnel</a>
            <a href="#">Blog</a>
            <a href="#">Collaborateur</a>
            <a href="#">Nos services</a>
        </div>

        <!-- Main Content -->
        <div class="col-md-10">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
                <h2 class="m-0">Gestion des Activités</h2>
                <input type="text" class="form-control w-25" placeholder="Recherche...">
            </div>

            <!-- Form Section -->
            <div class="row p-3">
                <!-- Left Column (Form) -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label for="titre" class="form-label">Titre</label>
                        <input type="text" class="form-control" id="titre">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" rows="4"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date">
                    </div>
                </div>

                <!-- Right Column (Image Preview + Upload) -->
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label">Prévisualisation de l'image</label>
                        <img src="https://via.placeholder.com/400x250" alt="Prévisualisation" class="preview-image mb-3">
                    </div>
                    <div class="mb-3">
                        <label for="image" class="form-label">Uploader une image</label>
                        <input type="file" class="form-control" id="image">
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-success">Enregistrer</button>
                        <button class="btn btn-primary">Modifier</button>
                        <button class="btn btn-danger">Supprimer</button>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="p-3">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Recherche dynamique...">
                </div>
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Actions</th>
                            <th>Titre</th>
                            <th>Description</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>
                                <button class="btn btn-sm btn-outline-primary me-1">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                            <td>Exemple</td>
                            <td>Une description ici</td>
                            <td>2025-04-30</td>
                        </tr>
                        <!-- Plus de lignes dynamiquement ici -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS + icons -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
